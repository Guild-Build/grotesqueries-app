name: Native source and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source:
    name: Native source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run build
      - run: npm test
      - run: node bin/package-posix.mjs
      - run: npm run check:package:posix
      - name: Clean Linux runtime filesystems
        if: runner.os == 'Linux'
        run: node bin/check-clean-linux.mjs dist/posix/*.tar.gz
      - name: Install pinned CLI for plugin checks without model calls
        if: runner.os == 'Linux'
        run: npm install --prefix .runtime/provider-cli --no-package-lock --ignore-scripts @anthropic-ai/claude-code@2.1.310
      - name: Assemble and qualify complete Guild builds
        if: runner.os == 'Linux'
        run: node bin/qualify-guild-kits.mjs dist/posix/*.tar.gz .runtime/provider-cli
      # Kits are deterministic: retain their proofs and reconstruct locally from
      # the exact base artifact, checking the final hash before publication.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && always()
        with:
          name: guild-kit-proof-${{ runner.arch }}
          path: |
            dist/guild-kits/*.assembly.json
            dist/guild-kits/*.qualification.json
            dist/guild-kits/*.sha256
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-candidate-${{ matrix.os }}
          path: |
            dist/posix/*.tar.gz
            dist/posix/*.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && always()
        with:
          name: evidence-linux-${{ runner.arch }}
          path: .runtime/verification/clean-linux/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
